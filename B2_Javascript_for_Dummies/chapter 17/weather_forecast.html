<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Loops, Arrays & Random</title>
  <link rel="stylesheet" href="chap17.css">
</head>
<body>
  <h1>Loops, Arrays & Random Demo</h1>

 <section id="countdownSection">
    <h2>Countdown</h2>
    <button id="startCountdownBtn">Start Countdown</button>
    <pre id="countdownOutput"></pre>
  </section>

 <section id="friendsSection">
    <h2>My Friends</h2>
    <button id="showFriendsBtn">Show Friends</button>
    <div id="friendsOutput"></div>
  </section>

 
  <section id="randomNumSection">
    <h2>Random Number</h2>
    <button id="randomNumberBtn">Generate Random Number</button>
    <div id="randomNumberOutput"></div>
  </section>

  <section id="randomFriendSection">
    <h2>Pick a Random Friend</h2>
    <button id="randomFriendBtn">Pick Random Friend</button>
    <div id="randomFriendOutput"></div>
  </section>

  <section id="forecastSection">
    <h2>5-Day Weather Forecast</h2>
    <button id="generateForecastBtn">Generate Forecast</button>
    <div id="fiveDayWeather"></div>
  </section>

  <script src="chap17.js"></script>
