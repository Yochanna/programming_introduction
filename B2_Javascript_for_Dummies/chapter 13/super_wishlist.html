<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Wish & Shopping List</title>
  <link rel="stylesheet" href="wishlist.css">
</head>
<body>
  <h1>My Wish List</h1>
  <div id="wishForm" class="form-area">
    <label for="iWant">What I want:</label>
    <input type="text" id="iWant" placeholder="Enter a wish item">
    <button id="addWish">Add Wish</button>
    <button id="printWish">Print Wish List</button>
  </div>
  <ul id="wishList"></ul>

  <h1>Shopping List</h1>
  <div id="shopForm" class="form-area">
    <label for="iBought">What I bought:</label>
    <input type="text" id="iBought" placeholder="Enter a shopping item">
    <button id="addItem">Add Item</button>
    <button id="printShop">Print Shopping List</button>
  </div>
  <ul id="shoppingList"></ul>

  <script src="wishlist.js"></script>
</body>
</html>
