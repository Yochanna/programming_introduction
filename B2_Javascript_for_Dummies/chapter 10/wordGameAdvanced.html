<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Ultimate Word Game</title>
  <link rel="stylesheet" href="wordGame.css">
</head>
<body>
  <h1>Ultimate Word Game</h1>

  <ul id="prompts">
    <li><label for="adjective1">Adjective:</label>
        <input id="adjective1" type="text"></li>
    <li><label for="verbIng1">A verb ending in “-ing”:</label>
        <input id="verbIng1" type="text"></li>
    <li><label for="roomInHouse">Room in a house:</label>
        <input id="roomInHouse" type="text"></li>
    <li><label for="color1">A color:</label>
        <input id="color1" type="text"></li>
    <li><label for="noun1">A noun:</label>
        <input id="noun1" type="text"></li>
    <li><label for="verbIng2">Another “-ing” verb:</label>
        <input id="verbIng2" type="text"></li>
    <li><label for="adjective2">Another adjective:</label>
        <input id="adjective2" type="text"></li>
    <li><label for="noun2">Another noun:</label>
        <input id="noun2" type="text"></li>
    <li><label for="number1">A number:</label>
        <input id="number1" type="text"></li>
    <li><label for="adjective3">Yet another adjective:</label>
        <input id="adjective3" type="text"></li>
    <li><label for="color2">Another color:</label>
        <input id="color2" type="text"></li>
    <li><label for="adjective4">One more adjective:</label>
        <input id="adjective4" type="text"></li>
    <li><label for="pluralNoun">A plural noun:</label>
        <input id="pluralNoun" type="text"></li>
    <li><label for="verbPast">A verb (past tense):</label>
        <input id="verbPast" type="text"></li>
    <li><label for="adverb1">An adverb:</label>
        <input id="adverb1" type="text"></li>
    <li><label for="genre">Genre of Music:</label>
        <input id="genre" type="text"></li>  
  </ul>

  <button id="generate">Generate Story</button>
  <button id="playAgain" style="display:none;">Play Again</button>

  <div id="story"></div>

  <script src="wordGame.js"></script>
</body>
</html>
