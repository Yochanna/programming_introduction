<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>My Grocery List</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <h1 id="main-title">Things I Need</h1>

  <h2>Unordered Grocery List</h2>
  <ul id="groceries">
    <li>carrots</li>
    <li>celery</li>
    <li>spinach</li>
    <li>potatoes</li>
  </ul>

  <h2>Ordered Grocery List</h2>
  <ol id="grocery-order">
    <li>carrots</li>
    <li>celery</li>
    <li>spinach</li>
    <li>potatoes</li>
  </ol>
</body>
</html>
