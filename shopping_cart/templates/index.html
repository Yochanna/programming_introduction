<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Shopping Cart</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='styles.css') }}">
</head>
<body>
  <div class="container">
    <h1>Shopping Cart</h1>

    <div class="items">
      <h2>Items</h2>
      <ul id="item-list">
        <!-- Items will be injected by script.js -->
      </ul>
    </div>

    <div class="cart">
      <h2>Your Cart</h2>
      <ul id="cart-list">
        <!-- Cart items go here -->
      </ul>
      <p id="cart-empty" class="muted">Your cart is empty.</p>
      <div class="cart-summary">
        <span>Total: $<span id="total">0</span></span>
        <button id="clear-cart" class="btn btn-secondary">Clear Cart</button>
      </div>
    </div>
  </div>

  <script src="{{ url_for('static', filename='script.js') }}"></script>
</body>
</html>
