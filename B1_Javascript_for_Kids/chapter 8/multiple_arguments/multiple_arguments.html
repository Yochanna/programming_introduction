<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Print Multiple Times</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <h1>Print Something Multiple Times</h1>

  <label>
    How many times?  
    <input type="number" id="count-input" value="5" min="0">
  </label>

  <label>
    What to print?  
    <input type="text" id="text-input" value="=^.^=">
  </label>

  <button id="print-button">Print It</button>
  <pre id="output-area"></pre>

  <script src="script.js"></script>
</body>
</html>
